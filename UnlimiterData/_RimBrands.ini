# This ini file is used to define which rim brands will appear with which order in the customization shop.
# It also allows you to have some other options.
#
# You can add more brands or overwrite the existing ones if you add ini files for each brand into the RimBrands directory. (See _example.notini for details)
#
# First section
#     NumberOfRimBrands = Defines the number of rim brands (without including 0) to get read from this file. You are allowed to have up to 63 different rim brands (excluding Car-Specific, OEM).
#
# Rim Brands sections (BrandX)
#     Required
#          BrandName = Defines the BRAND_NAME attribute value. If a rim car part has the attribute with the same value, it will appear under this brand.
#          String = Defines which string will be used in the menu. Only accepts labels.
#          Texture = Defines which icon will be used in the menu. Only accepts texture names.
#     Optional
#          NoRimSize = Removes size selection and lists all rims separately.

[RimBrands]
NumberOfRimBrands = 10

# TOUCH THIS ONE IF AND ONLY IF YOU KNOW WHAT ARE YOU DOING

# Custom (Car-Specific, OEM) Rims Brand
[Brand0]
BrandName = ""
String = "CO_RIM_BRAND_CUSTOM"
Texture = "VISUAL_RIMS_BRAND_CUSTOM"
NoRimSize = 1

